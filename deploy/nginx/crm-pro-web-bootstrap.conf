# CRM Pro — TEMPORARY bootstrap server, FIRST-TIME TLS issuance ONLY.
#
# The main config (crm-pro-web.conf) has a 443 block that references
# /etc/letsencrypt/live/crm.royalsofttechnology.com/*.pem. Those files do not
# exist until certbot issues the certificate, so `nginx -t` would FAIL if you
# load the main config first. This minimal HTTP-only server answers the ACME
# HTTP-01 challenge on port 80 so certbot can obtain the certificate; then you
# swap this out for the main config. Only needed on the very first deploy.
server {
    listen 80;
    listen [::]:80;
    server_name crm.royalsofttechnology.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
