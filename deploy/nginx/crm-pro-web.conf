# CRM Pro — Nginx site config (React SPA + same-origin API proxy)
#
# Install to:  /etc/nginx/sites-available/crm-pro-web.conf
# Enable with: ln -s /etc/nginx/sites-available/crm-pro-web.conf \
#                    /etc/nginx/sites-enabled/crm-pro-web.conf
#
# Production domain: crm.royalsofttechnology.com  (VPS 97.74.89.70)
# The static build lives at /var/www/crm-pro-web/current (a symlink to the
# latest release — see DEPLOYMENT.md). The backend keeps running on
# 127.0.0.1:3000 under PM2, unchanged.

# ---------------------------------------------------------------------------
# Port 80 — ACME challenge + redirect everything else to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name crm.royalsofttechnology.com;

    # Let's Encrypt HTTP-01 challenge files are served from here.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Port 443 — the app over TLS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crm.royalsofttechnology.com;

    # Certificates issued by certbot (see DEPLOYMENT.md, step 5).
    ssl_certificate     /etc/letsencrypt/live/crm.royalsofttechnology.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.royalsofttechnology.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # The compiled React build. index.html is the SPA entry point.
    root  /var/www/crm-pro-web/current;
    index index.html;

    # Reasonable hardening; harmless for a same-origin SPA.
    add_header X-Frame-Options        "SAMEORIGIN"        always;
    add_header X-Content-Type-Options "nosniff"           always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # gzip text assets (Vite already minifies; this compresses on the wire).
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # -----------------------------------------------------------------------
    # API — same-origin reverse proxy to the Node/Express backend.
    # NOTE: no trailing slash on proxy_pass, so the /api prefix is preserved
    # and the backend receives /api/... exactly as it does today.
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # -----------------------------------------------------------------------
    # Hashed build assets — safe to cache forever (filename changes on change).
    # -----------------------------------------------------------------------
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # -----------------------------------------------------------------------
    # SPA fallback (React Router refresh support).
    # Any path that is not a real file falls back to index.html so a hard
    # refresh or a shared deep link like /customers/123 loads the app instead
    # of a 404. index.html itself must NOT be cached, so a new deploy is
    # picked up immediately.
    # -----------------------------------------------------------------------
    location = /index.html {
        # A location with its own add_header does NOT inherit the server-level
        # headers, so repeat them here. index.html is the document that most
        # needs X-Frame-Options (clickjacking protection), and no-cache lets
        # each deploy be picked up immediately.
        add_header X-Frame-Options        "SAMEORIGIN"        always;
        add_header X-Content-Type-Options "nosniff"           always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Cache-Control          "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
